<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triáž úkolů — Osobní asistent</title>
<style>
  :root { --bg:#0d0f0d; --card:#161a16; --card2:#1d221d; --lime:#c8f04b; --lime-dim:#9dbf35; --text:#e8ece4; --muted:#9aa294; --red:#e06c5a; --border:#2a302a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:20px; display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  h1 .dot { width:10px; height:10px; border-radius:50%; background:var(--lime); display:inline-block; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  /* login */
  #login { max-width:340px; margin:15vh auto; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; text-align:center; }
  #login input { width:100%; padding:12px; margin:14px 0; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:15px; text-align:center; }
  #login input:focus { outline:none; border-color:var(--lime); }
  button { cursor:pointer; border:none; border-radius:8px; font-size:13px; font-weight:600; }
  .btn-lime { background:var(--lime); color:#111; padding:11px 20px; font-size:14px; }
  .btn-lime:hover { background:var(--lime-dim); }
  #loginErr { color:var(--red); font-size:13px; min-height:18px; margin-top:8px; }
  /* toolbar */
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:10px; }
  .count { font-size:13px; color:var(--muted); }
  .count b { color:var(--lime); font-size:16px; }
  .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); padding:8px 14px; }
  .btn-ghost:hover { color:var(--text); border-color:var(--muted); }
  /* block */
  .block { background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:18px; overflow:hidden; }
  .block-head { padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; border-bottom:1px solid var(--border); background:var(--card2); }
  .block-title { font-size:14px; font-weight:700; }
  .block-meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .btn-block { background:rgba(200,240,75,.12); color:var(--lime); padding:8px 12px; white-space:nowrap; border:1px solid rgba(200,240,75,.3); }
  .btn-block:hover { background:rgba(200,240,75,.22); }
  /* task */
  .task { padding:13px 16px; border-bottom:1px solid var(--border); }
  .task:last-child { border-bottom:none; }
  .t-row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .t-title { font-size:14px; line-height:1.45; }
  .t-meta { margin-top:5px; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .badge { padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; }
  .b-jno { background:rgba(200,240,75,.15); color:var(--lime); }
  .b-other { background:rgba(140,160,220,.15); color:#a9b8e8; }
  .b-due { background:rgba(224,108,90,.15); color:var(--red); }
  .quote { margin-top:6px; font-size:12px; color:var(--muted); font-style:italic; border-left:2px solid var(--border); padding-left:8px; display:none; }
  .task.open .quote { display:block; }
  .t-quote-toggle { background:none; color:var(--muted); font-size:11px; padding:2px 0; text-decoration:underline; }
  .t-actions { display:flex; gap:6px; flex-shrink:0; align-items:center; }
  .btn-ok { background:rgba(200,240,75,.14); color:var(--lime); width:38px; height:34px; font-size:16px; border:1px solid rgba(200,240,75,.3); }
  .btn-ok:hover { background:var(--lime); color:#111; }
  .btn-no { background:rgba(224,108,90,.12); color:var(--red); width:38px; height:34px; font-size:15px; border:1px solid rgba(224,108,90,.3); }
  .btn-no:hover { background:var(--red); color:#fff; }
  .btn-done { background:rgba(120,190,255,.12); color:#7bbcff; width:38px; height:34px; font-size:13px; border:1px solid rgba(120,190,255,.3); }
  .btn-done:hover { background:#7bbcff; color:#111; }
  .rt-done { color:#7bbcff; }
  .t-date { background:var(--bg); border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:6px; font-size:12px; width:118px; }
  .task.done { opacity:.45; }
  .task.done .t-actions { display:none; }
  .result-tag { font-size:12px; font-weight:700; }
  .rt-ok { color:var(--lime); } .rt-no { color:var(--red); }
  .undo { background:none; color:var(--muted); text-decoration:underline; font-size:12px; margin-left:8px; }
  #empty { text-align:center; padding:60px 20px; color:var(--muted); display:none; }
  #empty .big { font-size:40px; margin-bottom:12px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
  .spin { text-align:center; color:var(--muted); padding:40px; }
  .btn-edit { background:transparent; color:var(--muted); width:34px; height:34px; font-size:14px; border:1px solid var(--border); }
  .btn-edit:hover { color:var(--text); border-color:var(--muted); }
  .edit-form { margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .edit-form input[type=text] { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:9px; font-size:13px; }
  .edit-form input[type=text]:focus { outline:none; border-color:var(--lime); }
  .edit-form label { font-size:11px; color:var(--muted); }
  .edit-btns { display:flex; gap:8px; }
  .btn-save { background:var(--lime); color:#111; padding:8px 16px; }
  .btn-cancel { background:transparent; color:var(--muted); border:1px solid var(--border); padding:8px 16px; }
</style>
</head>
<body>
<div id="login">
  <h1 style="justify-content:center"><span class="dot"></span>Triáž úkolů</h1>
  <p class="sub" style="margin-top:6px">Osobní asistent — schvalování navržených úkolů</p>
  <input type="password" id="pw" placeholder="Heslo" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn-lime" onclick="doLogin()">Vstoupit</button>
  <div id="loginErr"></div>
</div>

<div class="wrap" id="app" style="display:none">
  <h1><span class="dot"></span>Triáž úkolů</h1>
  <p class="sub">✓ schválit · ✓✓ hotovo (schválit a uzavřít) · ✗ zamítnout · ✎ upravit název/řešitele · datum nastaví termín.</p>
  <div class="toolbar">
    <div class="count">Čeká na tebe: <b id="cnt">–</b> úkolů</div>
    <button class="btn-ghost" onclick="load()">↻ Obnovit</button>
  </div>
  <div id="blocks"><div class="spin">Načítám…</div></div>
  <div id="empty"><div class="big">🎉</div>Vše vyřízeno. Žádné úkoly nečekají na triáž.</div>
</div>
<div id="toast"></div>

<script>
const EP = 'https://dltopsftcmkxqrcobgrc.supabase.co/functions/v1/asist-triaz';
let ACCESS = null, DATA = null;

async function call(payload) {
  const r = await fetch(EP, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ access: ACCESS, ...payload }) });
  if (r.status === 401) throw new Error('unauthorized');
  return r.json();
}
async function doLogin() {
  ACCESS = document.getElementById('pw').value.trim();
  document.getElementById('loginErr').textContent = '';
  try {
    await load(true);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch(e) {
    document.getElementById('loginErr').textContent = e.message === 'unauthorized' ? 'Špatné heslo.' : 'Chyba spojení: ' + e.message;
  }
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(d){ if(!d) return null; const p=d.split('T')[0].split('-'); return p[2].replace(/^0/,'')+'. '+p[1].replace(/^0/,'')+'.'; }
function isJNO(o){ return !o || /jno|jiří|jiri/i.test(o); }

async function load(throwErr) {
  const el = document.getElementById('blocks');
  try { DATA = await call({ action:'list' }); }
  catch(e){ if(throwErr) throw e; el.innerHTML = '<div class="spin">Chyba: '+esc(e.message)+'</div>'; return; }
  render();
}
function render() {
  const recs = {}; (DATA.recordings||[]).forEach(r => recs[r.recording_id] = r);
  const groups = {};
  (DATA.tasks||[]).forEach(t => { const k = t.source_recording_id || '_other'; (groups[k] = groups[k] || []).push(t); });
  const keys = Object.keys(groups).sort((a,b) => ((recs[b]||{}).recorded_at||'').localeCompare((recs[a]||{}).recorded_at||''));
  let html = '', letter = 65;
  for (const k of keys) {
    const r = recs[k]; const ts = groups[k];
    const jnoCnt = ts.filter(t=>isJNO(t.owner)).length;
    const title = r ? esc(r.title) : 'Ostatní / bez nahrávky';
    const L = String.fromCharCode(letter++);
    html += `<div class="block" data-block="${k}">
      <div class="block-head"><div><div class="block-title">Blok ${L} — ${title}</div>
      <div class="block-meta">${ts.length} úkolů · ${jnoCnt}× 👤 JNO · ${ts.length-jnoCnt}× 👥 ostatní</div></div>
      <button class="btn-block" onclick="approveBlock('${k}')">✓ Schválit celý blok</button></div>`;
    for (const t of ts) {
      const jno = isJNO(t.owner);
      const due = t.due_date ? `<span class="badge b-due">termín ${fmtDate(t.due_date)}</span>` : '';
      html += `<div class="task" id="t-${t.id}">
        <div class="t-row"><div style="flex:1">
          <div class="t-title">${esc(t.title)}</div>
          <div class="t-meta">
            <span class="badge ${jno?'b-jno':'b-other'}">${jno?'👤 JNO':'👥 '+esc(t.owner)}</span>${due}
            ${t.source_quote?`<button class="t-quote-toggle" onclick="document.getElementById('t-${t.id}').classList.toggle('open')">citace</button>`:''}
            <span class="result-tag" id="res-${t.id}"></span>
          </div>
          ${t.source_quote?`<div class="quote">„${esc(t.source_quote)}"</div>`:''}
        </div>
        <div class="t-actions">
          <input type="date" class="t-date" id="d-${t.id}" value="${t.due_date||''}" title="Termín (nastaví se při schválení)">
          <button class="btn-edit" title="Upravit název / řešitele" onclick="editTask('${t.id}')">✎</button>
          <button class="btn-ok" title="Schválit" onclick="act('${t.id}','schvaleny')">✓</button>
          <button class="btn-done" title="Hotovo (schválit a rovnou uzavřít jako splněné)" onclick="act('${t.id}','hotovo')">✓✓</button>
          <button class="btn-no" title="Zamítnout" onclick="act('${t.id}','zamitnuty')">✗</button>
        </div></div>
        <div class="edit-form" id="ef-${t.id}" style="display:none">
          <label>Název úkolu</label><input type="text" id="et-${t.id}">
          <label>Řešitel (kdo to má udělat)</label><input type="text" id="eo-${t.id}">
          <div class="edit-btns"><button class="btn-save" onclick="saveEdit('${t.id}')">Uložit</button><button class="btn-cancel" onclick="cancelEdit('${t.id}')">Zrušit</button></div>
        </div></div>`;
    }
    html += '</div>';
  }
  document.getElementById('blocks').innerHTML = html;
  updateCount();
}
function updateCount() {
  const n = document.querySelectorAll('.task:not(.done)').length;
  document.getElementById('cnt').textContent = n;
  document.getElementById('empty').style.display = n === 0 ? 'block' : 'none';
  document.getElementById('blocks').style.display = n === 0 ? 'none' : 'block';
}
async function act(id, status, silent) {
  const el = document.getElementById('t-'+id);
  const dateVal = document.getElementById('d-'+id).value || undefined;
  const payload = { action:'update', id, status };
  if (status === 'schvaleny' && dateVal) payload.due_date = dateVal;
  try {
    const res = await call(payload);
    if (res.error) throw new Error(res.error);
    el.classList.add('done');
    const tag = status === 'schvaleny' ? '<span class="rt-ok">schváleno</span>'
      : status === 'hotovo' ? '<span class="rt-done">hotovo</span>'
      : '<span class="rt-no">zamítnuto</span>';
    document.getElementById('res-'+id).innerHTML = tag + '<button class="undo" onclick="undo(\''+id+'\')">zpět</button>';
    updateCount();
    if (!silent) toast(status === 'schvaleny' ? '✓ Schváleno' : status === 'hotovo' ? '✓✓ Hotovo' : '✗ Zamítnuto');
  } catch(e) { toast('Chyba: ' + e.message); }
}
async function undo(id) {
  try {
    const res = await call({ action:'update', id, status:'navrzeny' });
    if (res.error) throw new Error(res.error);
    const el = document.getElementById('t-'+id);
    el.classList.remove('done');
    document.getElementById('res-'+id).innerHTML = '';
    updateCount(); toast('Vráceno k triáži');
  } catch(e) { toast('Chyba: ' + e.message); }
}
async function approveBlock(k) {
  const ids = [...document.querySelectorAll(`[data-block="${k}"] .task:not(.done)`)].map(el => el.id.slice(2));
  for (const id of ids) await act(id, 'schvaleny', true);
  toast('✓ Blok schválen (' + ids.length + ' úkolů)');
}
function findTask(id){ return (DATA.tasks||[]).find(t => t.id === id); }
function editTask(id) {
  const t = findTask(id); if (!t) return;
  document.getElementById('et-'+id).value = t.title || '';
  document.getElementById('eo-'+id).value = t.owner || '';
  document.getElementById('ef-'+id).style.display = 'flex';
}
function cancelEdit(id) { document.getElementById('ef-'+id).style.display = 'none'; }
async function saveEdit(id) {
  const t = findTask(id); if (!t) return;
  const title = document.getElementById('et-'+id).value.trim();
  const owner = document.getElementById('eo-'+id).value.trim();
  if (!title) { toast('Název nesmí být prázdný'); return; }
  try {
    const res = await call({ action:'update', id, status: t.status || 'navrzeny', title, owner });
    if (res.error) throw new Error(res.error);
    t.title = title; t.owner = owner;
    render(); toast('✎ Uloženo');
  } catch(e) { toast('Chyba: ' + e.message); }
}
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
